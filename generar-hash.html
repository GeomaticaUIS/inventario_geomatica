<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generar hash de contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap" style="max-width:560px">
  <header class="site" style="border-bottom:2px solid var(--ink)">
    <div>
      <h1>Generar hash de contraseña</h1>
      <p>Usa esto para crear o cambiar una contraseña en <code>data/credentials.json</code>.</p>
    </div>
  </header>

  <div class="panel">
    <div class="field">
      <label for="pwd">Contraseña nueva</label>
      <input type="text" id="pwd" placeholder="Escribe la contraseña en texto plano">
    </div>
    <div class="field" style="margin-top:14px">
      <label>Hash SHA-256 (esto es lo que va en credentials.json)</label>
      <input type="text" id="out" readonly onclick="this.select()">
    </div>
  </div>

  <footer class="note">
    Copia el valor y pégalo en el campo <code>"hash"</code> del usuario correspondiente en
    <code>data/credentials.json</code>. Esta página no envía la contraseña a ningún lado, el cálculo
    ocurre en tu navegador.
  </footer>
</div>

<script>
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
document.getElementById('pwd').addEventListener('input', async (e) => {
  document.getElementById('out').value = e.target.value ? await sha256(e.target.value) : '';
});
</script>
</body>
</html>
